<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Export Study Notes — PDF</title>
  <link rel="stylesheet" href="export.css" />
</head>
<body>
  <div class="toolbar no-print">
    <button type="button" id="btn-print" class="btn-primary">Save as PDF (Print)</button>
    <button type="button" id="btn-close" class="btn-secondary">Close</button>
  </div>
  <article id="document">
    <header class="cover">
      <h1 id="doc-title">Study Notes</h1>
      <p class="meta" id="doc-channel"></p>
      <p class="meta" id="doc-url"></p>
      <p class="meta" id="doc-date"></p>
    </header>
    <main id="doc-body"></main>
    <footer class="doc-footer">
      <p>Generated by YouTube Study Notes</p>
    </footer>
  </article>
  <script src="export.js"></script>
</body>
</html>
