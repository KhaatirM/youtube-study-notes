<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Study Notes</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Study Notes</h1>
    <a href="#" id="open-options">Settings</a>
  </header>
  <div class="popup-body">
    <p class="hint">On a YouTube video: <strong>Open panel</strong>, press <strong>Alt+S</strong>, or use the floating <strong>Study Notes</strong> button.</p>
    <button type="button" id="open-panel" class="btn-primary">Open on current tab</button>
    <section>
      <h2>Recent notes</h2>
      <ul id="library"></ul>
      <p id="empty" class="empty">No saved notes yet.</p>
    </section>
  </div>
  <script src="popup.js"></script>
</body>
</html>
